if(state!==lastState){
 lastState=state;const key=n=>Math.round(n[0]*1000)+':'+n[1],matches=new Set(matched.map(key)),misses=new Set(missed.map(key));
 for(const layer of document.querySelectorAll('.missing-layer'))layer.replaceChildren();
 for(const e of entries){let color=e.beat>=start-.001&&e.beat<end-.001?(lastDark?'#dce8df':'#173c3b'):'#86958d';
  if(hand==='RIGHT'&&e.staff>1||hand==='LEFT'&&e.staff===1)color=lastDark?'#63766c':'#abb5ad';
  const k=Math.round(e.beat*1000)+':'+e.pitch;
  if(matches.has(k))color='#16836d';if(misses.has(k))color='#c04438';
  if(e.color!==color){e.g.setColor(color,{applyToNoteheads:true,applyToBeams:false,applyToFlag:false,applyToStem:false});e.color=color;}
  if(misses.has(k)){const mark=document.createElementNS(NS,'ellipse');for(const [a,v] of Object.entries({cx:e.x,cy:e.y,rx:8,ry:6,fill:'none',stroke:'#c04438','stroke-width':1.4,'stroke-dasharray':'2 2'}))mark.setAttribute(a,v);e.svg.querySelector('.missing-layer').appendChild(mark);}
 }
}
const paint=take===performanceData.take?[dataRevision,tolerance,bpm,zoom,horizontal,margin,dark].join(':'):JSON.stringify([take,expected,tolerance,bpm,zoom,horizontal,margin,dark]),now=performance.now();
// Retain finished glyph nodes; update only changed/new notes and growing key holds.
// WAIT's stationary beat must not continuously rebuild unreleased wrong notes.
if(paint!==lastTakePaint || (beat!==lastPaintBeat&&take.some(n=>n.duration===null)&&now-lastTakeTime>=80)){
 lastTakePaint=paint;lastTakeTime=now;lastPaintBeat=beat;drawTake(take,expected,tolerance,beat,bpm);
}
if(animate&&follow&&!dragging&&!loopDragging)animateCursor(beat,end,clockRate,follow,phaseFollowing);
else{stopCursorMotion();moveCursor(dragging&&dragBeat!==null?dragBeat:beat,0,fullEnd,follow);}
 moveLoopHandles(loopStart,loopEnd,loopEnabled,loopEditable);
 lastBeat=beat;
}catch(e){console.warn(e)}}
let resizeTimer;
window.addEventListener('resize',()=>{
 clearTimeout(resizeTimer);
 // Native pinch zoom changes the visual viewport, not the engraving width.
 // Height-only changes (controls/keyboard) must not repeatedly rebuild the score.
 resizeTimer=setTimeout(function reflow(){
  if(!ready||Math.abs(scrollRoot.clientWidth-lastLayoutWidth)<2)return;
  if(scroller.paused()){resizeTimer=setTimeout(reflow,120);return;}
  layout();if(lastArgs)progress(...lastArgs);
 },120);
});init();
