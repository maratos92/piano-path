let osmd,ready=false,entries=[],hitGroups=[],lastBeat=-1,lastState='',lastSelection='',lastZoom=1,lastHorizontal=false,lastMargin=4,lastDark=false,lastArgs=null,canSeek=false,dragging=false,dragPointer=null,dragBeat=null,loopEnabled=true,loopEditable=true,loopDragging=null,loopPointer=null,loopStart=0,loopEnd=0,scoreEnd=0;

const NS='http://www.w3.org/2000/svg';

async function init(){try{

function indexNotes(){entries=[];systemBounds.clear();const c=osmd.cursor;c.reset();let guard=0;
while(!c.Iterator.EndReached&&guard++<100000){const beat=c.Iterator.currentTimeStamp.RealValue*4;

// Index measure positions for inverse mouse/touch hit-testing. Layout uses SVG coordinates.
function indexHitGroups(){

 for(const e of entries){let measures=svgs.get(e.svg);if(!measures){measures=new Map();svgs.set(e.svg,measures);}
  if(!measures.has(e.measure))measures.set(e.measure,[]);measures.get(e.measure).push(e);}

  const upper=notes.filter(e=>e.staff===1);const source=upper.length?upper:notes;
  const points=new Map(source.map(e=>[e.beat,e.x]));const start=Math.min(...notes.map(e=>e.start)),end=Math.max(...notes.map(e=>e.end));
  const firstX=Math.min(...notes.map(e=>e.x)),lastX=Math.max(...notes.map(e=>e.right-5));
  if(!points.has(start))points.set(start,firstX-12);points.set(end,lastX);
  hitGroups.push({svg,measure,start,end,points:[...points.entries()].sort((a,b)=>a[1]-b[1]),
   left:Math.min(...notes.map(e=>e.left)),right:Math.max(...notes.map(e=>e.right)),top:systemBounds.get(notes[0].system).top,bottom:systemBounds.get(notes[0].system).bottom});

}
// Get the closest measure *on the touched system*, then interpolate between noteheads.
function beatAtClient(clientX,clientY){

  const dx=Math.max(m.left-p.x,0,p.x-m.right),dy=Math.max(m.top-p.y,0,p.y-m.bottom);
  const distance=dx+dy*3;if(distance<least){least=distance;best={m,x:p.x};}}

 for(let i=1;i<points.length;i++){if(x<=points[i][1]){left=points[i-1];right=points[i];break;}}

function atBeatPosition(beat){

function xAt(m,beat){
 const ps=[...m.points].sort((a,b)=>a[0]-b[0]);let left=ps[0],right=ps[ps.length-1];
 for(let i=1;i<ps.length;i++)if(beat<=ps[i][0]){left=ps[i-1];right=ps[i];break;}

function drawLoop(start,end,enabled){

function installScrubber(){

  const el=document.getElementById(id);

 function preview(event){const beat=beatAtClient(event.clientX,event.clientY);if(beat!==null){dragBeat=beat;if(lastArgs)moveCursor(beat,0,lastArgs[17]);if(window.Android?.previewSeek)Android.previewSeek(beat);}}

 line.addEventListener('pointermove',event=>{

function locateBeat(beat,staff){
 let e=entries.find(e=>e.staff===staff&&beat>=e.start-.001&&beat<e.end-.001);
 if(!e)e=entries.filter(e=>e.staff===staff).reduce((a,b)=>!a||Math.abs(b.beat-beat)<Math.abs(a.beat-beat)?b:a,null);

 points.push([e.end,e.right-5]);const left=points.filter(n=>n[0]<=beat).pop()||points[0],right=points.find(n=>n[0]>beat)||points[points.length-1];
 const x=right[0]===left[0]?left[1]:left[1]+(right[1]-left[1])*Math.max(0,Math.min(1,(beat-left[0])/(right[0]-left[0])));

function append(svg,tag,attrs,title){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(title){const t=document.createElementNS(NS,'title');t.textContent=title;el.appendChild(t);}svg.querySelector('.take-layer').appendChild(el);return el;}
function diatonic(p){return Math.floor(p/12)*7+[0,0,1,1,2,3,3,4,4,5,5,6][((p%12)+12)%12];}
function drawTake(take,expected,tolerance,beat,bpm){
 for(const layer of document.querySelectorAll('.take-layer'))layer.replaceChildren();
 const map=new Map(expected.map(n=>[n.id,n]));
 for(const n of take){const target=map.get(n.expectedId),staff=target?.staff || (n.pitch<60?2:1),loc=locateBeat(n.beat,staff);if(!loc)continue;

function progress(beat,matched,missed,start,end,zoom,horizontal,take=[],expected=[],tolerance=180,margin=4,dark=false,bpm=80,hand='BOTH',seekEnabled=true,loopOn=true,loopEdit=true,fullEnd=end,follow=true,accent='#1b554b',animate=false){if(!ready)return;

}catch(e){console.warn(e)}}
let resizeTimer;

  if(!ready||Math.abs(scrollRoot.clientWidth-lastLayoutWidth)<2)return;
  if(scroller.paused()){resizeTimer=setTimeout(reflow,120);return;}
  layout();if(lastArgs)progress(...lastArgs);
 },120);
});init();
