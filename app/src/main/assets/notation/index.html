<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4"><meta charset="utf-8"><style>
html,body{margin:0;background:#fffefb;color:#173c3b;font-family:system-ui}#loading{padding:20px;color:#617471}#score{position:relative;padding:0;min-height:180px}#range{display:none}svg{overflow:visible}#error{padding:20px;color:#c34d45;white-space:pre-wrap}#playhead{position:absolute;width:44px;margin-left:-22px;background:transparent;z-index:32;pointer-events:auto;touch-action:none;cursor:ew-resize}#playhead::before{content:'';position:absolute;left:21px;top:0;height:100%;width:3px;border-radius:2px;background:#369dbe;box-shadow:0 0 0 3px #369dbe18}#playhead::after{content:'';position:absolute;left:5px;top:-6px;width:34px;height:29px;border-radius:7px;background:#369dbe}#playhead{transition:left 50ms linear}#playhead[aria-disabled=true]{pointer-events:none;opacity:.6}.take-layer,.loop-layer{pointer-events:none}.loop-handle{position:absolute;width:36px;margin-left:-18px;background:transparent;z-index:23;cursor:ew-resize;touch-action:none;user-select:none;display:none}.loop-handle::before{content:'';position:absolute;left:17px;top:2px;bottom:0;border-left:2px dashed #b17a2d}.loop-handle b{position:absolute;left:6px;top:-12px;width:24px;height:27px;border-radius:6px;background:#d39d46;color:#24302c;font:bold 14px system-ui;text-align:center;line-height:26px;box-shadow:0 1px 4px #0004}.loop-handle[aria-disabled=true]{opacity:.55}
</style></head><body><div id="loading">Engraving your score…</div><div id="range"></div><div id="score"></div><div id="error"></div><script src="opensheetmusicdisplay.min.js"></script><script>
let osmd,ready=false,entries=[],hitGroups=[],lastBeat=-1,lastState='',lastSelection='',lastZoom=1,lastHorizontal=false,lastMargin=4,lastDark=false,lastArgs=null,canSeek=false,dragging=false,dragPointer=null,dragBeat=null,loopEnabled=true,loopEditable=true,loopDragging=null,loopPointer=null,loopStart=0,loopEnd=0,scoreEnd=0;
const NS='http://www.w3.org/2000/svg';
function fail(e){document.getElementById('loading').style.display='none';document.getElementById('error').textContent='Notation could not be rendered. '+e;if(window.Android)Android.error(String(e));}
function layout(){const r=osmd.EngravingRules;r.PageLeftMargin=lastMargin/(10*lastZoom);r.PageRightMargin=r.PageLeftMargin;r.SystemLeftMargin=0;r.PageTopMargin=1.5;osmd.Zoom=lastZoom;osmd.setOptions({renderSingleHorizontalStaffline:lastHorizontal,defaultColorMusic:lastDark?'#dce8df':'#173c3b',defaultColorLabel:lastDark?'#dce8df':'#173c3b'});document.body.style.background=lastDark?'#142421':'#fffefb';document.documentElement.style.background=document.body.style.background;osmd.render();indexNotes();}
async function init(){try{
osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay('score',{autoResize:false,backend:'svg',drawTitle:false,drawSubtitle:false,drawComposer:false,drawPartNames:false,drawMeasureNumbers:true,drawFingerings:true,followCursor:false});
await osmd.load(Android.score());layout();installScrubber();ready=true;document.getElementById('loading').style.display='none';Android.ready();
}catch(e){fail(e)}}
function indexNotes(){entries=[];const c=osmd.cursor;c.reset();let guard=0;
while(!c.Iterator.EndReached&&guard++<100000){const beat=c.Iterator.currentTimeStamp.RealValue*4;
for(const g of c.GNotesUnderCursor()){
 const n=g.sourceNote,element=g.getSVGGElement?.(),svg=element?.ownerSVGElement;if(!svg)continue;
 const head=element.querySelectorAll('.vf-notehead')[g.vfnoteIndex||0] || element;
 const rect=head.getBoundingClientRect(),pt=svg.createSVGPoint();pt.x=rect.left+rect.width/2;pt.y=rect.top+rect.height/2;const xy=pt.matrixTransform(svg.getScreenCTM().inverse());
 const m=g.parentVoiceEntry.parentStaffEntry.parentMeasure,source=m.parentSourceMeasure;
 entries.push({g,beat,pitch:n.Pitch?n.Pitch.getHalfTone()+12:-1,staff:n.parentStaffEntry.ParentStaff.idInMusicSheet+1,x:xy.x,y:n.Pitch?xy.y:g.PositionAndShape.AbsolutePosition.y*10,svg,
 measure:source.MeasureNumber,start:source.AbsoluteTimestamp.RealValue*4,end:(source.AbsoluteTimestamp.RealValue+source.Duration.RealValue)*4,right:(m.PositionAndShape.AbsolutePosition.x+m.PositionAndShape.Size.width)*10});
}c.next();}c.reset();c.hide();lastBeat=-1;lastState='';lastSelection='';
for(const svg of document.querySelectorAll('#score svg')){for(const cls of ['loop-layer','take-layer']){const layer=document.createElementNS(NS,'g');layer.setAttribute('class',cls);svg.appendChild(layer);}}
let line=document.getElementById('playhead');if(!line){line=document.createElement('div');line.id='playhead';line.setAttribute('role','slider');line.setAttribute('tabindex','0');line.setAttribute('aria-label','Blue score cursor. Drag to seek');document.getElementById('score').appendChild(line);}
for(const [id,label] of [['loop-start','A'],['loop-end','B']]){if(!document.getElementById(id)){const marker=document.createElement('div');marker.id=id;marker.className='loop-handle';marker.setAttribute('role','slider');marker.setAttribute('aria-label',label==='A'?'Loop start':'Loop end');const cap=document.createElement('b');cap.textContent=label;marker.appendChild(cap);document.getElementById('score').appendChild(marker);}}
indexHitGroups();}
// Index measure positions for inverse mouse/touch hit-testing. Layout uses SVG coordinates.
function indexHitGroups(){
 hitGroups=[];const svgs=new Map();
 for(const e of entries){let measures=svgs.get(e.svg);if(!measures){measures=new Map();svgs.set(e.svg,measures);}
  if(!measures.has(e.measure))measures.set(e.measure,[]);measures.get(e.measure).push(e);}
 for(const [svg,measures] of svgs)for(const [measure,notes] of measures){
  const upper=notes.filter(e=>e.staff===1);const source=upper.length?upper:notes;
  const points=new Map(source.map(e=>[e.beat,e.x]));const start=Math.min(...notes.map(e=>e.start)),end=Math.max(...notes.map(e=>e.end));
  const firstX=Math.min(...notes.map(e=>e.x)),lastX=Math.max(...notes.map(e=>e.right-5));
  if(!points.has(start))points.set(start,firstX-12);points.set(end,lastX);
  hitGroups.push({svg,measure,start,end,points:[...points.entries()].sort((a,b)=>a[1]-b[1]),
   left:firstX-18,right:Math.max(lastX,firstX+15),top:Math.min(...notes.map(e=>e.y))-40,bottom:Math.max(...notes.map(e=>e.y))+40});
 }
}
// Get the closest measure *on the touched system*, then interpolate between noteheads.
function beatAtClient(clientX,clientY){
 let best=null,least=Infinity;
 for(const m of hitGroups){const matrix=m.svg.getScreenCTM();if(!matrix)continue;
  const pt=m.svg.createSVGPoint();pt.x=clientX;pt.y=clientY;const p=pt.matrixTransform(matrix.inverse());
  const dx=Math.max(m.left-p.x,0,p.x-m.right),dy=Math.max(m.top-p.y,0,p.y-m.bottom);
  const distance=dx+dy*3;if(distance<least){least=distance;best={m,x:p.x};}}
 if(!best)return null;
 const {m,x}=best,points=best.m.points;
 let left=points[0],right=points[points.length-1];
 for(let i=1;i<points.length;i++){if(x<=points[i][1]){left=points[i-1];right=points[i];break;}}
 const interpolated=right[1]===left[1]?left[0]:left[0]+(right[0]-left[0])*Math.max(0,Math.min(1,(x-left[1])/(right[1]-left[1])));
 return Math.max(m.start,Math.min(m.end-.001,interpolated));
}
function atBeatPosition(beat){
 const loc=locateBeat(beat,1);if(!loc)return null;
 const svg=loc.e.svg,rect=svg.getBoundingClientRect(),root=document.getElementById('score').getBoundingClientRect(),scale=rect.width/svg.viewBox.baseVal.width,ys=loc.group.map(e=>e.y);
 return {x:rect.left-root.left+loc.x*scale,y:rect.top-root.top+(Math.min(...ys)-45)*scale,h:(Math.max(...ys)-Math.min(...ys)+80)*scale};
}
function xAt(m,beat){
 const ps=[...m.points].sort((a,b)=>a[0]-b[0]);let left=ps[0],right=ps[ps.length-1];
 for(let i=1;i<ps.length;i++)if(beat<=ps[i][0]){left=ps[i-1];right=ps[i];break;}
 const t=right[0]===left[0]?0:Math.max(0,Math.min(1,(beat-left[0])/(right[0]-left[0])));
 return left[1]+(right[1]-left[1])*t;
}
function drawLoop(start,end,enabled){
 const state=[start,end,enabled,lastDark].join(':');if(state===lastSelection)return;lastSelection=state;
 for(const svg of document.querySelectorAll('#score svg'))svg.querySelector('.loop-layer')?.replaceChildren();
 if(!enabled)return;
 for(const m of hitGroups){if(end<=m.start||start>=m.end)continue;
  const x1=xAt(m,Math.max(start,m.start)),x2=xAt(m,Math.min(end,m.end)),layer=m.svg.querySelector('.loop-layer');if(!layer)continue;
  const r=document.createElementNS(NS,'rect');r.setAttribute('x',Math.min(x1,x2));r.setAttribute('y',m.top);r.setAttribute('width',Math.max(2,Math.abs(x2-x1)));r.setAttribute('height',Math.max(1,m.bottom-m.top));
  r.setAttribute('fill',lastDark?'#e7bd77':'#a6d3c2');r.setAttribute('fill-opacity',lastDark?'.11':'.17');layer.appendChild(r);
 }
}
function moveLoopHandles(start,end,enabled,editable){
 drawLoop(start,end,enabled);
 for(const [id,beat] of [['loop-start',start],['loop-end',end]]){
  const el=document.getElementById(id),pos=atBeatPosition(beat);if(!el||!pos)continue;
  el.style.display='block';el.style.left=pos.x+'px';el.style.top=pos.y+'px';el.style.height=pos.h+'px';
  el.setAttribute('aria-disabled',editable?'false':'true');el.setAttribute('aria-valuenow',beat.toFixed(2));
 }
}
function moveCursor(beat,start,end){
 const loc=locateBeat(Math.max(start,Math.min(end,beat)),1);if(!loc)return;
 const svg=loc.e.svg,rect=svg.getBoundingClientRect(),root=document.getElementById('score').getBoundingClientRect(),scale=rect.width/svg.viewBox.baseVal.width;
 const ys=loc.group.map(e=>e.y),line=document.getElementById('playhead');
 line.style.left=(rect.left-root.left+loc.x*scale)+'px';
 line.style.top=(rect.top-root.top+(Math.min(...ys)-45)*scale)+'px';
 line.style.height=((Math.max(...ys)-Math.min(...ys)+80)*scale)+'px';
 if(!dragging){const viewport=line.getBoundingClientRect();if(viewport.left<0||viewport.right>window.innerWidth||viewport.top<0||viewport.bottom>window.innerHeight)line.scrollIntoView({block:'nearest',inline:'nearest'});}
}
function installScrubber(){
 const score=document.getElementById('score'),line=document.getElementById('playhead');
 for(const [id,which] of [['loop-start','start'],['loop-end','end']]){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',event=>{if(!loopEditable)return;loopDragging=which;loopPointer=event.pointerId;el.setPointerCapture(event.pointerId);event.preventDefault();event.stopPropagation();});
  el.addEventListener('pointermove',event=>{if(loopDragging!==which||loopPointer!==event.pointerId)return;let beat=beatAtClient(event.clientX,event.clientY);if(beat===null)return;
   beat=Math.round(beat*4)/4;if(which==='start')loopStart=Math.max(0,Math.min(loopEnd-.25,beat));else loopEnd=Math.max(loopStart+.25,Math.min(scoreEnd,beat));
   loopEnabled=true;lastSelection='';moveLoopHandles(loopStart,loopEnd,true,true);event.preventDefault();});
  function finish(event,commit){if(loopDragging!==which||loopPointer!==event.pointerId)return;const a=loopStart,b=loopEnd;loopDragging=null;loopPointer=null;if(el.hasPointerCapture(event.pointerId))el.releasePointerCapture(event.pointerId);if(commit&&b>a)Android.setLoop(a,b);event.preventDefault();event.stopPropagation();}
  el.addEventListener('pointerup',event=>finish(event,true));el.addEventListener('pointercancel',event=>finish(event,false));
 }

 function preview(event){const beat=beatAtClient(event.clientX,event.clientY);if(beat!==null){dragBeat=beat;if(lastArgs)moveCursor(beat,lastArgs[3],lastArgs[4]);}}
 line.addEventListener('pointerdown',event=>{
  if(!canSeek)return;dragging=true;dragPointer=event.pointerId;
  line.setPointerCapture(event.pointerId);preview(event);event.preventDefault();event.stopPropagation();
 });
 line.addEventListener('pointermove',event=>{
  if(!dragging||dragPointer!==event.pointerId)return;preview(event);event.preventDefault();
 });
 function finish(event,commit){
  if(!dragging||dragPointer!==event.pointerId)return;
  if(commit)preview(event);
  const target=dragBeat;dragging=false;dragPointer=null;dragBeat=null;
  if(line.hasPointerCapture(event.pointerId))line.releasePointerCapture(event.pointerId);
  if(commit&&target!==null)Android.seek(target);
  event.preventDefault();event.stopPropagation();
 }
 line.addEventListener('pointerup',event=>finish(event,true));
 line.addEventListener('pointercancel',event=>finish(event,false));
 // A simple tap on a note/measure also moves the playhead, but never steals scrolling.
 score.addEventListener('click',event=>{
  if(!canSeek||event.target===line||line.contains(event.target))return;
  const beat=beatAtClient(event.clientX,event.clientY);
  if(beat!==null)Android.seek(beat);
 });
 line.addEventListener('keydown',event=>{
  if(!canSeek||!lastArgs||!['ArrowLeft','ArrowRight'].includes(event.key))return;
  const delta=event.key==='ArrowRight'?.25:-.25;
  Android.seek(Math.max(0,Math.min(lastArgs[4],lastBeat+delta)));event.preventDefault();
 });
}
function locateBeat(beat,staff){
 let e=entries.find(e=>e.staff===staff&&beat>=e.start-.001&&beat<e.end-.001);
 if(!e)e=entries.filter(e=>e.staff===staff).reduce((a,b)=>!a||Math.abs(b.beat-beat)<Math.abs(a.beat-beat)?b:a,null);
 if(!e)e=entries[0];if(!e)return null;
 const group=entries.filter(n=>n.svg===e.svg&&n.measure===e.measure),points=[...new Map(group.map(n=>[n.beat,n.x])).entries()].sort((a,b)=>a[0]-b[0]);
 points.push([e.end,e.right-5]);const left=points.filter(n=>n[0]<=beat).pop()||points[0],right=points.find(n=>n[0]>beat)||points[points.length-1];
 const x=right[0]===left[0]?left[1]:left[1]+(right[1]-left[1])*Math.max(0,Math.min(1,(beat-left[0])/(right[0]-left[0])));
 return {e,x,group};
}
function append(svg,tag,attrs,title){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(title){const t=document.createElementNS(NS,'title');t.textContent=title;el.appendChild(t);}svg.querySelector('.take-layer').appendChild(el);return el;}
function diatonic(p){return Math.floor(p/12)*7+[0,0,1,1,2,3,3,4,4,5,5,6][((p%12)+12)%12];}
function drawTake(take,expected,tolerance,beat,bpm){
 for(const layer of document.querySelectorAll('.take-layer'))layer.replaceChildren();
 const map=new Map(expected.map(n=>[n.id,n]));
 for(const n of take){const target=map.get(n.expectedId),staff=target?.staff || (n.pitch<60?2:1),loc=locateBeat(n.beat,staff);if(!loc)continue;
 const ref=loc.group.filter(e=>e.staff===loc.e.staff&&e.pitch>=0).sort((a,b)=>Math.abs(a.pitch-n.pitch)-Math.abs(b.pitch-n.pitch))[0];if(!ref)continue;
 const y=ref.y-(diatonic(n.pitch)-diatonic(ref.pitch))*5;
 const color=!target?'#d34d50':n.onsetMs!==null&&Math.abs(n.onsetMs)>tolerance?'#c38420':'#16836d';
 const label=(target?'Matched ':'Extra ')+'MIDI '+n.pitch+(n.onsetMs===null?'':' · onset '+Math.round(n.onsetMs)+' ms')+(n.duration===null?' · unreleased':' · held '+Math.round(n.duration*60000/bpm)+' ms');
 append(loc.e.svg,'ellipse',{cx:loc.x,cy:y,rx:5,ry:3.6,fill:color,stroke:lastDark?'#142421':'#fffefb','stroke-width':.7,'data-take-id':n.id},label);
 if(!target){const accidental=append(loc.e.svg,'text',{x:loc.x-14,y:y+4,fill:color,'font-size':14},label);accidental.textContent=[1,3,6,8,10].includes(n.pitch%12)?'♯':'♮';}
 // Show physical key holds, split at bar and system boundaries. Capped to the rendered score.
 const end=n.beat+(n.duration??Math.max(.02,beat-n.beat));let cursor=n.beat,guard=0;
 while(cursor<end-.001&&guard++<100){const pos=locateBeat(cursor,staff);if(!pos)break;const until=Math.min(end,pos.e.end);if(until<=cursor+.001)break;
 const last=locateBeat(Math.max(cursor,until-.002),staff);const anchor=pos.group.find(e=>e.staff===pos.e.staff&&e.pitch>=0)||ref;
 const traceY=anchor.y-(diatonic(n.pitch)-diatonic(anchor.pitch))*5+6;
 append(pos.e.svg,'line',{x1:pos.x,y1:traceY,x2:Math.max(pos.x+2,last.x),y2:traceY,stroke:color,'stroke-width':2.4,opacity:.7,'data-hold-id':n.id},label);cursor=until+.001;}
 }
}
function progress(beat,matched,missed,start,end,zoom,horizontal,take=[],expected=[],tolerance=180,margin=4,dark=false,bpm=80,hand='BOTH',seekEnabled=true,loopOn=true,loopEdit=true,fullEnd=end){if(!ready)return;
try{
lastArgs=[beat,matched,missed,start,end,zoom,horizontal,take,expected,tolerance,margin,dark,bpm,hand,seekEnabled,loopOn,loopEdit,fullEnd];canSeek=seekEnabled;loopEditable=loopEdit;scoreEnd=fullEnd;if(!loopDragging){loopStart=start;loopEnd=end;loopEnabled=loopOn;}const cursor=document.getElementById('playhead');cursor.setAttribute('aria-disabled',seekEnabled?'false':'true');cursor.setAttribute('aria-valuenow',beat.toFixed(2));
if(zoom!==lastZoom||horizontal!==lastHorizontal||margin!==lastMargin||dark!==lastDark){lastZoom=zoom;lastHorizontal=horizontal;lastMargin=margin;lastDark=dark;layout();}
const state=JSON.stringify([matched,missed,start,end,take,hand]);
if(state!==lastState){lastState=state;for(const e of entries){let color=e.beat>=start-.001&&e.beat<end-.001?(lastDark?'#dce8df':'#173c3b'):'#86958d';
 if(hand==='RIGHT'&&e.staff>1||hand==='LEFT'&&e.staff===1)color=lastDark?'#63766c':'#abb5ad';
if(matched.some(n=>Math.abs(n[0]-e.beat)<.001&&n[1]===e.pitch))color='#16836d';
if(missed.some(n=>Math.abs(n[0]-e.beat)<.001&&n[1]===e.pitch))color='#c04438';
e.g.setColor(color,{applyToNoteheads:true,applyToBeams:false,applyToFlag:false,applyToStem:false});
if(missed.some(n=>Math.abs(n[0]-e.beat)<.001&&n[1]===e.pitch))append(e.svg,'ellipse',{cx:e.x,cy:e.y,rx:8,ry:6,fill:'none',stroke:'#c04438','stroke-width':1.4,'stroke-dasharray':'2 2'},'Missing note');}
}
// The overlay is redrawn as an unreleased note grows with the transport.
drawTake(take,expected,tolerance,beat,bpm);
for(const e of entries.filter(e=>missed.some(n=>Math.abs(n[0]-e.beat)<.001&&n[1]===e.pitch)))append(e.svg,'ellipse',{cx:e.x,cy:e.y,rx:8,ry:6,fill:'none',stroke:'#c04438','stroke-width':1.4,'stroke-dasharray':'2 2'},'Missing note');
moveCursor(dragging&&dragBeat!==null?dragBeat:beat,start,end);
 moveLoopHandles(loopStart,loopEnd,loopEnabled,loopEditable);
 lastBeat=beat;
}catch(e){console.warn(e)}}
window.addEventListener('resize',()=>{if(ready){layout();if(lastArgs)progress(...lastArgs);}});init();
</script></body></html>
