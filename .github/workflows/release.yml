name: Signed release APK and Play bundle
on:
  workflow_dispatch:
  push:
    tags: ['v*']
env:
  PIANO_SUPPORT_URL: ${{ vars.PIANO_SUPPORT_URL }}
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      PIANO_KEYSTORE: /tmp/piano-path-release.jks
      PIANO_STORE_PASSWORD: ${{ secrets.PIANO_STORE_PASSWORD }}
      PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
      PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private signing key
        env:
          PIANO_KEYSTORE_BASE64: ${{ secrets.PIANO_KEYSTORE_BASE64 }}
        run: |
          test -n "$PIANO_KEYSTORE_BASE64" || { echo 'Configure the release environment signing secrets; see docs/RELEASE.md.'; exit 1; }
          printf '%s' "$PIANO_KEYSTORE_BASE64" | base64 --decode > "$PIANO_KEYSTORE"
          chmod 600 "$PIANO_KEYSTORE"
      - name: Verify and build signed release
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: piano-path-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
            app/build/outputs/bundle/release/app-release.aab
      - name: Remove private signing key
        if: always()
        run: rm -f "$PIANO_KEYSTORE"
