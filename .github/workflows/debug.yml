name: Build and test Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  PIANO_SUPPORT_URL: ${{ vars.PIANO_SUPPORT_URL }}
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      # Reuse the same debug certificate between successful APK builds. Avoid saving an
      # ephemeral ~/.android/debug.keystore generated independently on each runner.
      - name: Restore persistent personal-test debug signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: piano-path-personal-debug-keystore-v1
      - name: Restore durable debug key when configured; fail if cached key is lost
        env:
          PIANO_DEBUG_KEYSTORE_BASE64: ${{ secrets.PIANO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$PIANO_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$PIANO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore" || { echo 'Signing key unavailable. Restore the existing private key using PIANO_DEBUG_KEYSTORE_BASE64; do not generate a replacement.'; exit 1; }
      - name: Verify no generated demo-score assets are bundled
        run: |
          test ! -e app/src/main/assets/scores/catalog.json
          if test -d app/src/main/assets/scores && find app/src/main/assets/scores -name '*.musicxml' -print -quit | grep -q .; then
            echo 'Unexpected bundled demo scores' >&2
            exit 1
          fi
      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug
      - name: Verify existing-install signing compatibility
        run: |
          certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          printf 'Built APK certificate: %s\n' "$certificate"
          keytool -exportcert -rfc -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | openssl x509 -noout -fingerprint -sha256
          ./gradlew :app:signingReport
          test "$certificate" = "$(cat config/debug-certificate.sha256)" || { echo 'Debug signer changed. Refusing to distribute an incompatible update.'; exit 1; }
      - name: Check 16 KB native and APK alignment
        run: |
          python3 scripts/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: piano-path-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            profile: pixel_2
            name: phone
          - api: 35
            profile: pixel_c
            name: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports-${{ matrix.name }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/

  upgrade:
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: piano-path-debug-apk
          path: upgrade-artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test_debug_upgrade.sh upgrade-artifact/app-debug.apk
