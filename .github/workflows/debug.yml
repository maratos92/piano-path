name: Build and test Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  PIANO_SUPPORT_URL: ${{ vars.PIANO_SUPPORT_URL }}
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify original library is reproducible
        run: |
          python3 scripts/generate_library.py
          git diff --exit-code -- app/src/main/assets/scores docs/CATALOG.md
      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug
      - name: Check 16 KB native and APK alignment
        run: |
          python3 scripts/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: piano-path-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            profile: pixel_2
            name: phone
          - api: 35
            profile: pixel_c
            name: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports-${{ matrix.name }}
          path: app/build/reports/androidTests/
